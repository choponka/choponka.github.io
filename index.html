<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Бильярд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
  :root { --bg:#2b1230; --card:#4a2252; --text:#fff; --muted:#e8bff0; --accent:#ffd23f; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; touch-action:none;
    font-family:"Nunito", ui-rounded, system-ui, sans-serif; font-weight:700; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  #hud { display:flex; gap:6px; padding:6px 8px 0; width:100%; box-sizing:border-box; justify-content:center; }
  .chip { flex:1; max-width:120px; background:var(--card); border:3px solid transparent; border-radius:16px;
    padding:6px 8px; display:flex; flex-direction:column; font-size:14px; color:var(--muted); transition:border-color .2s, transform .2s; }
  .chip b { font-size:22px; color:var(--text); font-weight:900; }
  .chip span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c); margin-right:6px; }
  .chip.on { border-color:var(--c); transform:translateY(-2px); color:var(--text); }
  canvas { display:block; max-width:100vw; max-height:calc(100dvh - 130px); aspect-ratio:400/700; border-radius:22px;
    box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #menu { background:var(--card); color:var(--text); border:0; border-radius:14px; padding:8px 22px; font:inherit; font-size:16px; font-weight:900; }
  #ov { position:fixed; inset:0; background:rgba(25,8,30,.85); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:5; }
  #ov.hide { display:none; }
  .box { background:var(--card); border-radius:26px; padding:28px 22px; text-align:center; width:min(340px, 88vw); }
  .box h1 { margin:0 0 8px; font-size:30px; font-weight:900; }
  .box p { margin:0 0 20px; color:var(--muted); font-size:17px; line-height:1.3; }
  .row { display:flex; gap:10px; }
  .row button { flex:1; background:var(--accent); color:#2b1230; border:0; border-radius:16px; padding:18px 0; font:inherit; font-size:30px; font-weight:900; }
  .row button:active { transform:scale(.94); }
</style>
</head>
<body>
<div id="hud"></div>
<canvas id="c" width="800" height="1400"></canvas>
<button id="menu">Новая игра</button>

<div id="ov">
  <div class="box">
    <h1 id="ovT">Бильярд</h1>
    <p id="ovP">Сколько игроков? Можно играть одному.</p>
    <div class="row"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div>
  </div>
</div>

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const img = new Image(); img.src = IMG_SRC;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.scale(2, 2);
const W = 400, H = 700, RAIL = 24, R = 22, PR = 38, REWARD = 10;
const PC = ['#ffd23f', '#4cc9f0', '#80ed99', '#ffffff'];
const pockets = [[RAIL,RAIL],[W-RAIL,RAIL],[RAIL,H/2],[W-RAIL,H/2],[RAIL,H-RAIL],[W-RAIL,H-RAIL]];

let balls = [], cue, N = 1, money = [], cur = 0, aim = null, shots = 0;
let cueLost = false, shooting = false, scratch = false, shotPocketed = 0, playing = false;
const ov = document.getElementById('ov');

function startGame(n) {
  N = n; money = Array(n).fill(0); cur = 0; shots = 0;
  balls = []; cueLost = false; shooting = false; scratch = false; shotPocketed = 0;
  cue = { x: W/2, y: 540, vx: 0, vy: 0, a: 0, cue: true };
  balls.push(cue);
  for (let row = 0; row < 4; row++)
    for (let k = 0; k <= row; k++)
      balls.push({ x: W/2 + (k - row/2) * (R*2 + 1), y: 250 - row * R * 1.75, vx: 0, vy: 0, a: Math.random() * 6 });
  playing = true; ov.classList.add('hide'); renderHud();
}
function renderHud() {
  document.getElementById('hud').innerHTML = money.map((m, i) =>
    `<div class="chip ${i === cur ? 'on' : ''}" style="--c:${PC[i]}"><span>${N === 1 ? 'Твой счёт' : 'Игрок ' + (i + 1)}</span><b>${m} ₴</b></div>`).join('');
}
function showOverlay(title, text) {
  document.getElementById('ovT').textContent = title;
  document.getElementById('ovP').textContent = text;
  ov.classList.remove('hide'); playing = false;
}
function endShot() {
  shooting = false;
  if (balls.length === 1) {
    if (N === 1) { showOverlay('Все шары забиты!', `Счёт: ${money[0]} ₴, ударов: ${shots}. Сыграем ещё?`); return; }
    const best = Math.max(...money), w = money.map((m, i) => m === best ? i + 1 : 0).filter(Boolean);
    showOverlay(w.length > 1 ? 'Ничья' : `Победил игрок ${w[0]}`, `Лучший счёт: ${best} ₴. Сыграем ещё?`);
    return;
  }
  if (scratch || shotPocketed === 0) cur = (cur + 1) % N;
  renderHud();
}
const moving = () => balls.some(b => Math.hypot(b.vx, b.vy) > 0.05);

function respawnCue() {
  let y = 540;
  while (y < H - RAIL - R && balls.some(b => Math.hypot(b.x - W/2, b.y - y) < R * 2.2)) y += 6;
  cue = { x: W/2, y, vx: 0, vy: 0, a: 0, cue: true };
  balls.push(cue);
}

function step() {
  for (let s = 0; s < 4; s++) {
    for (const b of balls) {
      b.x += b.vx / 4; b.y += b.vy / 4;
      if (b.x < RAIL + R) { b.x = RAIL + R; b.vx = Math.abs(b.vx) * 0.9; }
      if (b.x > W - RAIL - R) { b.x = W - RAIL - R; b.vx = -Math.abs(b.vx) * 0.9; }
      if (b.y < RAIL + R) { b.y = RAIL + R; b.vy = Math.abs(b.vy) * 0.9; }
      if (b.y > H - RAIL - R) { b.y = H - RAIL - R; b.vy = -Math.abs(b.vy) * 0.9; }
    }
    for (let i = 0; i < balls.length; i++)
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d < R * 2 && d > 0) {
          const nx = dx / d, ny = dy / d, o = (R * 2 - d) / 2;
          a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
          const p = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
          if (p > 0) { a.vx -= p * nx; a.vy -= p * ny; b.vx += p * nx; b.vy += p * ny; }
        }
      }
  }
  for (const b of balls) {
    b.a += (b.vx >= 0 ? 1 : -1) * Math.hypot(b.vx, b.vy) / R * 0.6;
    b.vx *= 0.985; b.vy *= 0.985;
    if (Math.hypot(b.vx, b.vy) < 0.05) b.vx = b.vy = 0;
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (pockets.some(p => Math.hypot(b.x - p[0], b.y - p[1]) < PR)) {
      balls.splice(i, 1);
      if (b.cue) { cueLost = true; scratch = true; }
      else { money[cur] += REWARD; shotPocketed++; renderHud(); }
    }
  }
  if (cueLost && !moving()) { respawnCue(); cueLost = false; }
}

function drawBall(b) {
  ctx.beginPath(); ctx.arc(b.x + 2, b.y + 3, R, 0, 7); ctx.fillStyle = 'rgba(60,0,50,.3)'; ctx.fill();
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
  ctx.rotate(b.a);
  if (img.complete && img.naturalWidth) ctx.drawImage(img, -R, -R, R * 2, R * 2);
  else { ctx.fillStyle = '#ccc'; ctx.fillRect(-R, -R, R * 2, R * 2); }
  ctx.rotate(-b.a);
  if (b.cue) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-R, -R, R * 2, R * 2); }
  const g = ctx.createRadialGradient(-R * .35, -R * .4, R * .1, 0, 0, R);
  g.addColorStop(0, 'rgba(255,255,255,.4)'); g.addColorStop(.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = g; ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.restore();
  ctx.beginPath(); ctx.arc(b.x, b.y, R - 1, 0, 7);
  ctx.strokeStyle = b.cue ? '#fff' : 'rgba(0,0,0,.4)'; ctx.lineWidth = b.cue ? 3 : 1.5; ctx.stroke();
}

function drawCue(ux, uy, pull) {
  const off = R + 8 + pull, len = 260;
  ctx.save();
  ctx.translate(cue.x, cue.y); ctx.rotate(Math.atan2(uy, ux)); ctx.scale(1, 1.5);
  ctx.fillStyle = 'rgba(60,0,50,.28)';
  ctx.beginPath(); ctx.moveTo(-off, -1); ctx.lineTo(-off - len, -5); ctx.lineTo(-off - len, 8); ctx.lineTo(-off, 4); ctx.fill();
  const g = ctx.createLinearGradient(0, -7, 0, 7);
  g.addColorStop(0, '#f6dba6'); g.addColorStop(.5, '#d29a52'); g.addColorStop(1, '#8a5a2b');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-off - 7, -3); ctx.lineTo(-off - len, -7); ctx.lineTo(-off - len, 7); ctx.lineTo(-off - 7, 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2b1230';
  ctx.beginPath(); ctx.moveTo(-off - len * 0.66, -5.7); ctx.lineTo(-off - len, -7); ctx.lineTo(-off - len, 7); ctx.lineTo(-off - len * 0.66, 5.7); ctx.fill();
  ctx.fillStyle = PC[cur]; ctx.fillRect(-off - len * 0.66 - 5, -5.9, 5, 11.8);
  ctx.fillStyle = '#fff'; ctx.fillRect(-off - 7, -3.2, 7, 6.4);
  ctx.fillStyle = '#3a86ff'; ctx.beginPath(); ctx.arc(-off, 0, 3.3, 0, 7); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#8e2f7c'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#b84fa5'; ctx.lineWidth = 3; ctx.strokeRect(6, 6, W - 12, H - 12);
  ctx.fillStyle = '#ff8cc0'; ctx.fillRect(RAIL, RAIL, W - RAIL * 2, H - RAIL * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(RAIL, 585); ctx.lineTo(W - RAIL, 585); ctx.stroke();
  ctx.fillStyle = '#2b0d2c';
  for (const p of pockets) { ctx.beginPath(); ctx.arc(p[0], p[1], PR - 4, 0, 7); ctx.fill(); }
  for (const b of balls) drawBall(b);
  if (aim && !moving() && playing) {
    const dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.hypot(dx, dy);
    if (len > 3) {
      const ux = dx / len, uy = dy / len;
      ctx.setLineDash([6, 8]); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cue.x + ux * R, cue.y + uy * R); ctx.lineTo(cue.x + ux * 260, cue.y + uy * 260); ctx.stroke();
      ctx.setLineDash([]);
      drawCue(ux, uy, Math.min(len, 120) * 0.8);
    }
  }
}

function pt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  if (!playing || shooting || moving() || !balls.includes(cue)) return;
  const p = pt(e); aim = { sx: p.x, sy: p.y, x: p.x, y: p.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (aim) { const p = pt(e); aim.x = p.x; aim.y = p.y; } });
cv.addEventListener('pointerup', () => {
  if (!aim) return;
  const dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.hypot(dx, dy);
  if (len > 8) {
    const power = Math.min(len, 120) / 120 * 22;
    cue.vx = dx / len * power; cue.vy = dy / len * power;
    shooting = true; scratch = false; shotPocketed = 0; shots++;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  }
  aim = null;
});

document.querySelectorAll('.row button').forEach(b => b.onclick = () => startGame(+b.dataset.n));
document.getElementById('menu').onclick = () => showOverlay('Новая игра', 'Сколько игроков? Можно играть одному.');

function loop() {
  if (playing) { step(); if (shooting && !moving() && !cueLost) endShot(); }
  draw(); requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
