<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Бильярд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0e1319; --card:#18212b; --text:#eef2f6; --muted:#8a99a8; --accent:#ffd23f; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; touch-action:none;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  #hud { display:flex; gap:6px; padding:6px 8px 0; width:100%; box-sizing:border-box; justify-content:center; }
  .chip { flex:1; max-width:110px; background:var(--card); border:2px solid transparent; border-radius:12px;
    padding:6px 8px; display:flex; flex-direction:column; font-size:12px; color:var(--muted); transition:border-color .2s, transform .2s; }
  .chip b { font-size:16px; color:var(--text); font-weight:700; }
  .chip span::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--c); margin-right:6px; }
  .chip.on { border-color:var(--c); transform:translateY(-2px); color:var(--text); }
  #wrap { position:relative; }
  canvas { display:block; max-width:100vw; max-height:calc(100dvh - 120px); aspect-ratio:400/700; border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #menu { background:transparent; color:var(--muted); border:1px solid #2a3846; border-radius:10px; padding:5px 14px; font-size:13px; }
  #ov { position:fixed; inset:0; background:rgba(8,12,16,.82); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:5; }
  #ov.hide { display:none; }
  .box { background:var(--card); border-radius:20px; padding:26px 24px; text-align:center; width:min(320px, 86vw); }
  .box h1 { margin:0 0 6px; font-size:24px; }
  .box p { margin:0 0 18px; color:var(--muted); font-size:14px; }
  .row { display:flex; gap:10px; }
  .row button { flex:1; background:var(--accent); color:#111; border:0; border-radius:12px; padding:14px 0; font-size:18px; font-weight:700; }
  .row button:active { transform:scale(.96); }
</style>
</head>
<body>
<div id="hud"></div>
<div id="wrap"><canvas id="c" width="800" height="1400"></canvas></div>
<button id="menu">Новая игра</button>

<div id="ov">
  <div class="box">
    <h1 id="ovT">Бильярд</h1>
    <p id="ovP">Сколько игроков? Ходите по очереди.</p>
    <div class="row">
      <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.scale(2, 2);
const W = 400, H = 700, RAIL = 24, R = 11, PR = 20, REWARD = 10;
const PC = ['#ffd23f', '#4cc9f0', '#f72585', '#80ed99'];
const pockets = [[RAIL,RAIL],[W-RAIL,RAIL],[RAIL,H/2],[W-RAIL,H/2],[RAIL,H-RAIL],[W-RAIL,H-RAIL]];
const colors = ['#ffd23f','#3a86ff','#ef476f','#8338ec','#fb8500','#06d6a0','#b5179e','#22282f',
                '#ffd23f','#3a86ff','#ef476f','#8338ec','#fb8500','#06d6a0','#b5179e'];

let balls = [], cue, N = 2, money = [], cur = 0, aim = null;
let cueLost = false, shooting = false, scratch = false, shotPocketed = 0, playing = false;

const ov = document.getElementById('ov');

function startGame(n) {
  N = n; money = Array(n).fill(0); cur = 0;
  balls = []; cueLost = false; shooting = false; scratch = false; shotPocketed = 0;
  cue = { x: W/2, y: 520, vx: 0, vy: 0, c: '#fff', cue: true };
  balls.push(cue);
  let i = 0;
  for (let row = 0; row < 5; row++)
    for (let k = 0; k <= row; k++, i++)
      balls.push({ x: W/2 + (k - row/2) * (R*2 + 1), y: 200 - row * (R*1.8), vx: 0, vy: 0, c: colors[i], n: i + 1 });
  playing = true; ov.classList.add('hide'); renderHud();
}
function renderHud() {
  document.getElementById('hud').innerHTML = money.map((m, i) =>
    `<div class="chip ${i === cur ? 'on' : ''}" style="--c:${PC[i]}"><span>Игрок ${i + 1}</span><b>${m} ₴</b></div>`).join('');
}
function showOverlay(title, text) {
  document.getElementById('ovT').textContent = title;
  document.getElementById('ovP').textContent = text;
  ov.classList.remove('hide'); playing = false;
}
function endShot() {
  shooting = false;
  if (balls.length === 1) {
    const best = Math.max(...money), w = money.map((m, i) => m === best ? i + 1 : 0).filter(Boolean);
    showOverlay(w.length > 1 ? 'Ничья' : `Победил игрок ${w[0]}`, `Лучший счёт: ${best} ₴. Сыграем ещё? Выбери число игроков.`);
    return;
  }
  if (scratch || shotPocketed === 0) cur = (cur + 1) % N;
  renderHud();
}

const moving = () => balls.some(b => Math.hypot(b.vx, b.vy) > 0.05);

function respawnCue() {
  let y = 520;
  while (y < H - RAIL - R && balls.some(b => Math.hypot(b.x - W/2, b.y - y) < R * 2.2)) y += 6;
  cue = { x: W/2, y, vx: 0, vy: 0, c: '#fff', cue: true };
  balls.push(cue);
}

function step() {
  for (let s = 0; s < 4; s++) {
    for (const b of balls) {
      b.x += b.vx / 4; b.y += b.vy / 4;
      if (b.x < RAIL + R) { b.x = RAIL + R; b.vx = Math.abs(b.vx) * 0.9; }
      if (b.x > W - RAIL - R) { b.x = W - RAIL - R; b.vx = -Math.abs(b.vx) * 0.9; }
      if (b.y < RAIL + R) { b.y = RAIL + R; b.vy = Math.abs(b.vy) * 0.9; }
      if (b.y > H - RAIL - R) { b.y = H - RAIL - R; b.vy = -Math.abs(b.vy) * 0.9; }
    }
    for (let i = 0; i < balls.length; i++)
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d < R * 2 && d > 0) {
          const nx = dx / d, ny = dy / d, o = (R * 2 - d) / 2;
          a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
          const p = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
          if (p > 0) { a.vx -= p * nx; a.vy -= p * ny; b.vx += p * nx; b.vy += p * ny; }
        }
      }
  }
  for (const b of balls) { b.vx *= 0.985; b.vy *= 0.985; if (Math.hypot(b.vx, b.vy) < 0.05) b.vx = b.vy = 0; }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (pockets.some(p => Math.hypot(b.x - p[0], b.y - p[1]) < PR)) {
      balls.splice(i, 1);
      if (b.cue) { cueLost = true; scratch = true; }
      else { money[cur] += REWARD; shotPocketed++; renderHud(); }
    }
  }
  if (cueLost && !moving()) { respawnCue(); cueLost = false; }
}

function drawCue(ux, uy, pull) {
  const off = R + 8 + pull, len = 230;
  ctx.save();
  ctx.translate(cue.x, cue.y); ctx.rotate(Math.atan2(uy, ux));
  // тень
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.moveTo(-off, -2); ctx.lineTo(-off - len, -7); ctx.lineTo(-off - len, 9); ctx.lineTo(-off, 4); ctx.fill();
  // основное дерево
  const g = ctx.createLinearGradient(0, -7, 0, 7);
  g.addColorStop(0, '#f1d29a'); g.addColorStop(.5, '#c98f4a'); g.addColorStop(1, '#8a5a2b');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-off - 6, -3); ctx.lineTo(-off - len, -7); ctx.lineTo(-off - len, 7); ctx.lineTo(-off - 6, 3); ctx.closePath(); ctx.fill();
  // тёмная рукоять
  ctx.fillStyle = '#1b222b';
  ctx.beginPath(); ctx.moveTo(-off - len * 0.68, -5.6); ctx.lineTo(-off - len, -7); ctx.lineTo(-off - len, 7); ctx.lineTo(-off - len * 0.68, 5.6); ctx.fill();
  ctx.fillStyle = PC[cur]; ctx.fillRect(-off - len * 0.68 - 4, -5.8, 4, 11.6);
  // ферула и наклейка
  ctx.fillStyle = '#f4f4f0'; ctx.fillRect(-off - 6, -3.2, 6, 6.4);
  ctx.fillStyle = '#3a86ff'; ctx.beginPath(); ctx.arc(-off, 0, 3.2, 0, 7); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#1c2733'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#2d3d4d'; ctx.lineWidth = 2; ctx.strokeRect(5, 5, W - 10, H - 10);
  ctx.fillStyle = '#0f7a68'; ctx.fillRect(RAIL, RAIL, W - RAIL * 2, H - RAIL * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(RAIL, 520 + 34); ctx.lineTo(W - RAIL, 520 + 34); ctx.stroke();
  ctx.fillStyle = '#05080b';
  for (const p of pockets) { ctx.beginPath(); ctx.arc(p[0], p[1], PR - 2, 0, 7); ctx.fill(); }
  for (const b of balls) {
    ctx.beginPath(); ctx.arc(b.x + 1.5, b.y + 2, R, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 7); ctx.fillStyle = b.c; ctx.fill();
    if (b.n) {
      ctx.beginPath(); ctx.arc(b.x, b.y, 5.4, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.fillStyle = '#111'; ctx.font = 'bold 7.5px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.n, b.x, b.y + .3);
    }
    ctx.beginPath(); ctx.arc(b.x - 4, b.y - 4, 2.6, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fill();
  }
  if (aim && !moving() && playing) {
    const dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.hypot(dx, dy);
    if (len > 3) {
      const ux = dx / len, uy = dy / len;
      ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cue.x + ux * R, cue.y + uy * R); ctx.lineTo(cue.x + ux * 240, cue.y + uy * 240); ctx.stroke();
      ctx.setLineDash([]);
      drawCue(ux, uy, Math.min(len, 120) * 0.8);
    }
  }
}

function pt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  if (!playing || shooting || moving() || !balls.includes(cue)) return;
  const p = pt(e); aim = { sx: p.x, sy: p.y, x: p.x, y: p.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (aim) { const p = pt(e); aim.x = p.x; aim.y = p.y; } });
cv.addEventListener('pointerup', () => {
  if (!aim) return;
  const dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.hypot(dx, dy);
  if (len > 8) {
    const power = Math.min(len, 120) / 120 * 22;
    cue.vx = dx / len * power; cue.vy = dy / len * power;
    shooting = true; scratch = false; shotPocketed = 0;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  }
  aim = null;
});

document.querySelectorAll('.row button').forEach(b => b.onclick = () => startGame(+b.dataset.n));
document.getElementById('menu').onclick = () => showOverlay('Новая игра', 'Сколько игроков? Ходите по очереди.');

function loop() {
  if (playing) { step(); if (shooting && !moving() && !cueLost) endShot(); }
  draw(); requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
